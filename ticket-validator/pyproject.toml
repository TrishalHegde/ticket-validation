[project]
name = "ticket-validator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Trishal hegde", email = "trishalhegde@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.4",
]

[project.scripts]
ticket-validator = "ticket_validator:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
